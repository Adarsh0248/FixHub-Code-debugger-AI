name: bugbrother

networks:
  bugbrother:
    driver: bridge
  vsgw:
    external: true
    name: vsgw

volumes:
  postgres-data:

services:
  # Single-node KRaft-mode Kafka (no separate Zookeeper container needed).
  kafka:
    image: apache/kafka:3.8.0
    container_name: code-guardian-kafka
    ports:
      # Host port 9094, not 9092 - that port is already used by another
      # project's Kafka broker (vectorsearch-gateway) on this machine.
      - "9094:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://workflow-kafka:29092,PLAINTEXT_HOST://localhost:9094
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      CLUSTER_ID: ciWo0hqPTliBU3S8IPkK1w
    restart: unless-stopped
    networks:
      bugbrother:
        aliases: [workflow-kafka]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 || exit 1"]
      interval: 15s
      timeout: 15s
      retries: 10
      start_period: 120s


  ingestion-service:
    build: 
      context: ./fixhub-ingestion-service
    container_name: fixhub-ingestion-service
    ports:
      - "8080:8080"
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: workflow-kafka:29092
      VECTOR_RESULT_KAFKA_BOOTSTRAP_SERVERS: vector-kafka:9092
      VECTOR_RESULT_TOPIC: vector-index-results
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-YOUR_GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-YOUR_GITHUB_CLIENT_SECRET}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
      INDEX_RETIRED_RETENTION: ${INDEX_RETIRED_RETENTION:-7d}
      FRONTEND_URL: "http://localhost:5173"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-bugbrother}
      POSTGRES_USER: ${POSTGRES_USER:-bugbrother}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bugbrother-local-only}
      INTERNAL_WORKER_KEY: ${INTERNAL_WORKER_KEY:-bugbrother-local-worker-key-change-me}
    restart: unless-stopped
    networks:
      - bugbrother
      - vsgw
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s


  worker-service:
    build: 
      context: ./fixhub-worker-service
    container_name: fixhub-worker-service
    ports:
      - "8081:8081"
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - bugbrother
      - vsgw
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

    environment:
      KAFKA_BOOTSTRAP_SERVERS: workflow-kafka:29092
      OPENAI_API_KEY: ${OPENAI_API_KEY:-YOUR_OPENAI_API_KEY}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://router.huggingface.co/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-meta-llama/Llama-3.1-8B-Instruct}
      VECTORSEARCH_GATEWAY_HOST: gatewayd
      VECTORSEARCH_GATEWAY_PORT: "50053"
      INGESTION_INTERNAL_URL: http://ingestion-service:8080
      INTERNAL_WORKER_KEY: ${INTERNAL_WORKER_KEY:-bugbrother-local-worker-key-change-me}

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bugbrother}
      POSTGRES_USER: ${POSTGRES_USER:-bugbrother}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bugbrother-local-only}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - bugbrother
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    networks:
      - bugbrother
    depends_on:
      ingestion-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
