# ==========================================
# Server Configuration
# ==========================================
server.port=8080
server.forward-headers-strategy=framework

# ==========================================
# Frontend Configuration
# ==========================================
# Origin the frontend SPA is served from. Used for CORS and post-login/logout redirects.
frontend.url=${FRONTEND_URL:http://localhost:5173}

# ==========================================
# GitHub OAuth2 Configuration
# ==========================================
# Set these using environment variables GITHUB_CLIENT_ID and GITHUB_CLIENT_SECRET
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID:YOUR_GITHUB_CLIENT_ID}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET:YOUR_GITHUB_CLIENT_SECRET}
# Spring's GitHub provider defaults to "read:user" only, which isn't enough
# for CommitService to create branches/commit files -- that needs "repo".
spring.security.oauth2.client.registration.github.scope=repo,read:user

# Shared HMAC secret configured on the GitHub repository webhook.
bugbrother.github.webhook-secret=${GITHUB_WEBHOOK_SECRET:}

# ==========================================
# Kafka Producer Configuration
# ==========================================
# You can override the kafka broker address using KAFKA_BOOTSTRAP_SERVERS environment variable
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# ==========================================
# PostgreSQL / Workflow State
# ==========================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/bugbrother}
spring.datasource.username=${POSTGRES_USER:bugbrother}
spring.datasource.password=${POSTGRES_PASSWORD:bugbrother-local-only}

# Flyway owns schema creation. Hibernate only validates Java mappings.
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Maximum time the HTTP request waits for Kafka to acknowledge publication.
bugbrother.kafka.publish-timeout=${KAFKA_PUBLISH_TIMEOUT:10s}

# Task-status projection consumer
spring.kafka.consumer.group-id=code-guardian-status-projection
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.razeef.bugbrother.events

# Maximum silence between worker updates.
bugbrother.task.stale-after=${TASK_STALE_AFTER:30m}

# Interval between stale-task scans, in milliseconds.
bugbrother.task.stale-scan-delay=${TASK_STALE_SCAN_DELAY:60000}

# ==========================================
# Repository index generations
# ==========================================
bugbrother.index.model-id=${EMBEDDING_MODEL:sentence-transformers/all-MiniLM-L6-v2}
bugbrother.index.embedding-dimension=${EMBEDDING_DIMENSION:384}
bugbrother.index.chunker-version=${CHUNKER_VERSION:line-window-v1}
bugbrother.index.cleanup-scan-delay=${INDEX_CLEANUP_SCAN_DELAY:60000}

# Shared credential used only for worker-to-ingestion internal API calls.
bugbrother.internal.worker-key=${INTERNAL_WORKER_KEY:bugbrother-local-worker-key-change-me}

# Final vector-engine results come from the vector gateway's Kafka broker,
# which is separate from BugBrother's workflow Kafka broker.
bugbrother.vector-results.bootstrap-servers=${VECTOR_RESULT_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
bugbrother.vector-results.topic=${VECTOR_RESULT_TOPIC:vector-index-results}
bugbrother.vector-results.group-id=${VECTOR_RESULT_GROUP_ID:bugbrother-vector-results}
