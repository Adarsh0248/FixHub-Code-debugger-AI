# ==========================================
# Server Configuration
# ==========================================
server.port=8081

# ==========================================
# Spring AI / LLM Configuration
# ==========================================
# Set your OpenAI API Key via environment variable OPENAI_API_KEY
spring.ai.openai.api-key=${OPENAI_API_KEY:YOUR_OPENAI_API_KEY}
spring.ai.openai.base-url=${OPENAI_BASE_URL:https://router.huggingface.co/v1}
spring.ai.openai.chat.options.model=${OPENAI_MODEL:meta-llama/Llama-3.1-8B-Instruct}

# OPENAI_API_KEY=hf_xxxxxxxxxxxx          # your HF access token (huggingface.co/settings/tokens)
# OPENAI_BASE_URL=https://router.huggingface.co/v1
# OPENAI_MODEL=meta-llama/Llama-3.1-8B-Instruct   # or any HF model id that supports chat

# ==========================================
# Kafka Consumer Configuration
# ==========================================
# You can override the kafka broker address using KAFKA_BOOTSTRAP_SERVERS environment variable
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=code-guardian-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*

# ==========================================
# Vector Search Gateway (RAG retrieval/indexing)
# ==========================================
# gRPC address of the vectorsearch-gateway (gatewayd). If unreachable, RAG
# context is skipped and debugging falls back to today's plain behavior.
vectorsearch.gateway.host=${VECTORSEARCH_GATEWAY_HOST:localhost}
vectorsearch.gateway.port=${VECTORSEARCH_GATEWAY_PORT:50053}

# Worker status-event producer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

bugbrother.kafka.publish-timeout=${KAFKA_PUBLISH_TIMEOUT:10s}

# ==========================================
# Ingestion internal API
# ==========================================
bugbrother.ingestion.base-url=${INGESTION_INTERNAL_URL:http://localhost:8080}
bugbrother.internal.worker-key=${INTERNAL_WORKER_KEY:bugbrother-local-worker-key-change-me}